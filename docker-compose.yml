# Local development and testing. For production, see README.md ("Deploying").
services:
  db:
    # MariaDB, as on Hostinger. The app also works with MySQL 8.0.16+.
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dlcf-root
      MARIADB_USER: dlcf
      MARIADB_PASSWORD: dlcf
      MARIADB_DATABASE: dlcf
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://dlcf:dlcf@db:3306/dlcf
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["app"]
volumes:
  mariadb-data:
